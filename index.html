<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONEPLAYER TV - Prueba HLS</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#070a10;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    padding:22px 30px;
    background:#0d111a;
    border-bottom:1px solid #202838;
}

header h1{
    margin:0;
    font-size:27px;
}

header span{
    color:#00d9ff;
}

main{
    max-width:1150px;
    margin:auto;
    padding:25px;
}

.player{
    background:#000;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 15px 50px rgba(0,0,0,.4);
}

video{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
}

.info{
    padding:15px 18px;
    background:#111722;
}

.info strong{
    color:#00d9ff;
}

.status{
    margin-top:8px;
    padding:10px;
    background:#080b12;
    border-radius:8px;
    color:#aab4c5;
    font-family:monospace;
    font-size:13px;
    white-space:pre-wrap;
    word-break:break-word;
}

.status.ok{
    color:#55e6a5;
}

.status.error{
    color:#ff7373;
}

h2{
    margin-top:30px;
}

.channels{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:14px;
}

.channel{
    background:#111722;
    border:1px solid #202b3d;
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    transition:.2s;
}

.channel:hover{
    border-color:#00d9ff;
    transform:translateY(-2px);
}

.channel p{
    margin:8px 0 0;
    color:#8d98aa;
    font-size:14px;
}

.url{
    margin-top:15px;
    padding:12px;
    background:#05070b;
    border-radius:8px;
    color:#687487;
    font-size:11px;
    word-break:break-all;
}

@media(max-width:600px){
    main{padding:15px}
    .channels{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
    <h1>ONE<span>PLAYER</span> TV</h1>
</header>

<main>

    <div class="player">

        <video id="video" controls playsinline></video>

        <div class="info">
            <div>
                Reproduciendo:
                <strong id="channelName">Ningún canal</strong>
            </div>

            <div id="status" class="status">
Esperando un canal...
            </div>

            <div id="url" class="url">
URL: -
            </div>
        </div>

    </div>


    <h2>Canales de prueba</h2>

    <div class="channels">

        <div class="channel" onclick="playChannel(
            '24/7 Canal de Noticias',
            'https://59c5c86e10038.streamlock.net/6605140/6605140/playlist.m3u8'
        )">
            <strong>24/7 Canal de Noticias</strong>
            <p>Noticias</p>
        </div>


        <div class="channel" onclick="playChannel(
            'Acequia TV',
            'https://ythls.onrender.com/channel/UCrYFBjFOP_zlFzsif9XDhgw.m3u8'
        )">
            <strong>Acequia TV</strong>
            <p>Argentina</p>
        </div>


        <div class="channel" onclick="playChannel(
            'Agrotendencia TV',
            'https://5fc584f3f19c8.streamlock.net/agrotendencia/videoagrotendencia_hls1/playlist.m3u8'
        )">
            <strong>Agrotendencia TV</strong>
            <p>Documentales</p>
        </div>


        <div class="channel" onclick="playChannel(
            'Aire de Santa Fe',
            'https://sc1.stweb.tv/airedigital/live/playlist.m3u8'
        )">
            <strong>Aire de Santa Fe</strong>
            <p>Argentina</p>
        </div>


        <div class="channel" onclick="playChannel(
            'América TV',
            'https://raw.githubusercontent.com/MachineSystems/archived_m3u8/main/america_hls.m3u8'
        )">
            <strong>América TV</strong>
            <p>Argentina</p>
        </div>

    </div>

</main>


<script>

const video = document.getElementById("video");
const channelName = document.getElementById("channelName");
const statusBox = document.getElementById("status");
const urlBox = document.getElementById("url");

let hls = null;


function status(message, type="") {

    statusBox.className = "status " + type;
    statusBox.textContent = message;

}


function playChannel(name, url) {

    channelName.textContent = name;

    urlBox.textContent = "URL: " + url;

    status(
        "Iniciando reproducción...\n" +
        "Canal: " + name
    );

    if (hls) {

        hls.destroy();
        hls = null;

    }

    video.pause();
    video.removeAttribute("src");
    video.load();


    // HLS.js

    if (Hls.isSupported()) {

        hls = new Hls({

            enableWorker: true,

            lowLatencyMode: false,

            debug: false

        });


        hls.on(Hls.Events.MEDIA_ATTACHED, function() {

            status(
                "MEDIA ATTACHED\n" +
                "El reproductor está conectado al video."
            );

        });


        hls.on(Hls.Events.MANIFEST_LOADING, function(event, data) {

            status(
                "MANIFEST LOADING\n\n" +
                "Intentando descargar:\n" +
                data.url
            );

        });


        hls.on(Hls.Events.MANIFEST_LOADED, function(event, data) {

            status(
                "MANIFEST LOADED\n\n" +
                "URL:\n" + data.url
            );

        });


        hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {

            status(
                "MANIFEST PARSED ✓\n\n" +
                "Calidades encontradas: " +
                data.levels.length +
                "\n\nIntentando reproducir...",
                "ok"
            );

            video.play().catch(function(error) {

                status(
                    "MANIFEST OK, pero el navegador no inició automáticamente.\n\n" +
                    "Error: " + error.message +
                    "\n\nPresioná ▶ en el reproductor.",
                    "error"
                );

            });

        });


        hls.on(Hls.Events.ERROR, function(event, data) {

            console.error("HLS ERROR:", data);

            let mensaje =
                "❌ ERROR HLS\n\n" +

                "Tipo: " + data.type + "\n" +

                "Detalle: " + data.details + "\n" +

                "Código: " +
                (data.response && data.response.code
                    ? data.response.code
                    : "N/A") +
                "\n\n" +

                "Fatal: " + data.fatal;


            if (data.response) {

                mensaje +=
                    "\n\nResponse URL:\n" +
                    (data.response.url || "N/A");

            }


            if (data.networkDetails) {

                mensaje +=
                    "\n\nNetwork details:\n" +
                    String(data.networkDetails);

            }


            status(mensaje, "error");


            // Intentos automáticos solamente para errores recuperables

            if (data.fatal) {

                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                    status(
                        mensaje +
                        "\n\nIntentando recuperar el error de red...",
                        "error"
                    );

                    setTimeout(function() {

                        if (hls) {
                            hls.startLoad();
                        }

                    }, 1500);

                }

                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

                    status(
                        mensaje +
                        "\n\nIntentando recuperar el error multimedia...",
                        "error"
                    );

                    hls.recoverMediaError();

                }

            }

        });


        hls.loadSource(url);

        hls.attachMedia(video);

    }


    // HLS nativo: Safari / algunos dispositivos

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        status(
            "HLS NATIVO\n\n" +
            "El navegador soporta HLS directamente.\n" +
            "Cargando stream..."
        );


        video.src = url;


        video.addEventListener("loadedmetadata", function() {

            status(
                "STREAM CARGADO ✓\n\n" +
                "Metadatos recibidos.\n" +
                "Intentando reproducir...",
                "ok"
            );

            video.play().catch(function(error) {

                status(
                    "El stream cargó, pero no comenzó automáticamente.\n\n" +
                    error.message,
                    "error"
                );

            });

        }, {once:true});


        video.addEventListener("error", function() {

            status(
                "❌ ERROR DEL VIDEO\n\n" +
                "Código: " +
                (video.error ? video.error.code : "N/A") +
                "\n\n" +
                "El navegador no pudo reproducir este stream.",
                "error"
            );

        }, {once:true});

    }


    else {

        status(
            "❌ HLS NO COMPATIBLE\n\n" +
            "Este navegador no puede reproducir HLS.",
            "error"
        );

    }

}

</script>

</body>
</html>
